name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish, but keep
# only one queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Local dev is pinned to Node 18 (see .nvmrc) because that is what is
          # installed on the dev machine; CI uses a current LTS. Vite 5 supports
          # both, and the build output is identical. Node 20 is deprecated on
          # GitHub runners, which is why this is 22.
          node-version: 22
          cache: npm

      # Fails fast with an explanation if the lockfile was generated in a way
      # that omits this runner's native binaries. `npm install
      # --package-lock-only` on macOS records only the darwin rollup/esbuild
      # packages; npm ci then installs a tree with no Linux binary, and vitest
      # dies instantly with an error that says nothing about lockfiles.
      - name: Verify lockfile covers this platform
        run: |
          node -e "
            const lock = require('./package-lock.json');
            const names = Object.keys(lock.packages ?? {});
            const missing = ['@rollup/rollup-linux-x64-gnu', '@esbuild/linux-x64']
              .filter((p) => !names.includes('node_modules/' + p));
            if (missing.length) {
              console.error('package-lock.json is missing Linux binaries: ' + missing.join(', '));
              console.error('Regenerate it with a full \`npm install\` (not --package-lock-only).');
              process.exit(1);
            }
            console.log('Lockfile covers Linux: ok');
          "

      - run: npm ci

      # The atlas assets are committed under public/atlas, so the build needs
      # no network access and no `npm run atlas:fetch` step here.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Project sites are served from /<repo>/, which is already the default
          # in vite.config.ts. Set explicitly so the deploy target is visible.
          BRAINCAD_BASE: /BrainCAD/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
